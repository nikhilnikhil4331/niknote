name: Android release

# Builds the Capacitor Android app and publishes a signed APK (sideload stores like
# Orion, direct downloads) plus an AAB (Google Play) to a GitHub Release.
#
# Signing: add these repository secrets to sign with your own key —
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         (optional, default "niknote")
#   ANDROID_KEY_PASSWORD      (optional, defaults to the keystore password)
# Without them the build still succeeds, signed with the debug key — fine for a
# quick install, but Android will reject later updates signed with a different key,
# so publish the first real release with your own keystore.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (e.g. 1.0.1). Leave empty to use android/app/build.gradle'
        required: false
        default: ''
      version_code:
        description: 'versionCode (integer, must increase every release)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        run: |
          NAME="${{ inputs.version_name }}"
          CODE="${{ inputs.version_code }}"
          if [ -z "$NAME" ]; then
            NAME=$(grep -oP 'appVersionName = System.getenv\("NIKNOTE_VERSION_NAME"\) \?: "\K[^"]+' android/app/build.gradle)
          fi
          if [ -z "$CODE" ]; then
            CODE=$(grep -oP 'NIKNOTE_VERSION_CODE"\) \?: "\K[^"]+' android/app/build.gradle)
          fi
          CODE=$(echo "$CODE" | tr -dc '0-9')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore (if provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/niknote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/niknote-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'niknote' }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        working-directory: android
        env:
          NIKNOTE_VERSION_NAME: ${{ steps.version.outputs.name }}
          NIKNOTE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artefacts
        run: |
          mkdir -p out
          V="${{ steps.version.outputs.name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "out/niknote-v${V}.apk"
          find android/app/build/outputs/bundle -name '*.aab' -exec cp {} "out/niknote-v${V}.aab" \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: niknote-android-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.name }}"
          TAG="${GITHUB_REF_NAME}"
          NOTES="NikNote ${V} — handwritten-feeling study notes with NikAI.
          Install: download the .apk on your phone and allow install from this source.
          package: online.niknote.app · minSdk 24 · versionCode ${{ steps.version.outputs.code }}"
          gh release create "$TAG" out/* --title "NikNote ${V}" --notes "$NOTES" --verify-tag || \
          gh release upload "$TAG" out/* --clobber
