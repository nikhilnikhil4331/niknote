name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build first: a couple of assertions read dist/index.html, and a clean
      # checkout has no dist until this step runs.
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders: the real keys live in Vercel, not in CI.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-placeholder

      - name: Tests
        run: npm run test -- --reporter=dot

      - name: Dead-code check
        run: npm run check:dead-code
